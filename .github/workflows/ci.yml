name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra cpu
      - run: uv run --extra cpu ruff check
      - run: uv run --extra cpu pytest -m "not network and not slow and not gpu"
